<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="crimsonNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="stageNoir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f2e" />
      <stop offset="100%" stop-color="#0a0a10" />
    </linearGradient>
    <linearGradient id="silverAmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Outer Vinyl / Shield Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#stageNoir)" stroke="url(#crimsonNeon)" stroke-width="4.5" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Lightning Bolt & Guitar Plectrum Motif -->
  <polygon points="250,110 320,180 250,235 180,180" fill="none" stroke="url(#silverAmp)" stroke-width="2.5" />
  <polygon points="255,125 240,175 260,175 235,225 265,170 245,170" fill="url(#crimsonNeon)" />
  
  <!-- Soundwave Bars -->
  <rect x="145" y="170" width="6" height="20" rx="3" fill="url(#silverAmp)" />
  <rect x="160" y="155" width="6" height="50" rx="3" fill="url(#crimsonNeon)" />
  <rect x="335" y="155" width="6" height="50" rx="3" fill="url(#crimsonNeon)" />
  <rect x="350" y="170" width="6" height="20" rx="3" fill="url(#silverAmp)" />

  <!-- Horizontal Divider Line -->
  <line x1="90" y1="262" x2="410" y2="262" stroke="url(#crimsonNeon)" stroke-width="2" opacity="0.85" />
  <circle cx="250" cy="262" r="5" fill="#ffffff" />

  <!-- Typography -->
  <text x="250" y="322" text-anchor="middle" font-family="'Cinzel', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="6">VIPRESS</text>
  <text x="250" y="358" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="url(#crimsonNeon)" letter-spacing="5">LIVE ROCK &#8226; RECORDING</text>
  <text x="250" y="392" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="4">KOLKATA &#8226; OFFICIAL EPK</text>
</svg>
